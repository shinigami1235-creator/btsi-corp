<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>8BTSI Corp. website editor</title>
  </head>
  <body>
    <script>
      // Opened with no address after the hash, the editor picks its own view
      // and lands on the picture library, which is not where anyone means to
      // start. Send it to the product list instead. An address that already
      // names a view is left alone, so a bookmark still works.
      if (!location.hash || location.hash === '#' || location.hash === '#/') {
        location.replace(location.pathname + '#/collections/products');
      }
    </script>

    <!-- Sveltia CMS. It runs entirely in this browser: it reads and writes the
         files in the GitHub repository over the GitHub API using the token the
         editor signs in with. There is no server of ours anywhere in this. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
